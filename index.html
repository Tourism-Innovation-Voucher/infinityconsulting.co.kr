<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>인피니티컨설팅</title>
  <meta name="description" content="손님이 호텔을 기억하는 방식을 설계합니다. 호텔 고객 관계에서 AI 상담, ESG 경영까지.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <link rel="icon" href="assets/infinity-mark.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script>if (new URLSearchParams(location.search).get("ref")) document.documentElement.classList.add("ref");</script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="hero">
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="nav">
      <a class="brand" href="#">
        <img src="assets/infinity-mark.png" alt="" width="28" height="26">
        <span>인피니티컨설팅</span>
      </a>
      <nav aria-label="주요 메뉴">
        <ul>
          <li><a href="#services">사업 영역</a></li>
          <li><a href="#company">회사 소개</a></li>
          <li><a href="#contact">문의</a></li>
        </ul>
      </nav>
    </header>

    <div class="copy">
      <h1>손님이 호텔을<br>기억하는 방식을 설계합니다</h1>
      <p>고객 관계에서 AI 상담, ESG 경영까지, 오래 기억되는 호텔의 이유를 함께 만듭니다.</p>
      <div class="actions">
        <a class="btn" href="#contact">문의하기</a>
        <a class="link" href="#services">사업 영역 보기</a>
      </div>
    </div>

    <p class="foot">인피니티컨설팅, 호텔의 고객 관계를 설계하는 파트너</p>
  </main>

  <!-- The traced mark, in two bodies. scene.js reads these blocks when they
       carry text and fetches the assets when they are empty. -->
  <script type="text/plain" id="mark-strong" data-src="assets/infinity-mark-strong.svg"></script>
  <script type="text/plain" id="mark-pale" data-src="assets/infinity-mark-pale.svg"></script>
  <script type="text/plain" id="mark-glb"></script>
  <script type="module" src="scene.js"></script>
</body>
</html>
